<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EOD Balancing</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <h1>EOD BALANCING</h1>
    <input type="text" placeholder="Enter Cash Capital" id="cash-capital">
    <h2>Cyber Cafe / POS</h2>
    <input type="text" placeholder="Enter Cash Left" id="cash-left">
    <h2>Sales</h2>
    <input type="text" placeholder="Sales Cash" id="sales-cash">
    <input type="text" placeholder="Sales POS Amount" id="sales-pos">
    <h2>Calculating Amount in POS</h2>
    <input type="text" placeholder="Current Amount in Pos" id="current-pos-amount" >
    <input type="text" placeholder="Enter amount left in the Pos yesterday" id="pos-capital">
    <button id="calculate-btn">Calculate</button>
    <h3 id="profit-or-loss"></h3>
    
    <div id="calculation-report"></div>
</body>
<script src="script.js"></script>
</html>
