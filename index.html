<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles.css" />
    <title>EOD Balancing</title>
  </head>
  <body>
    <h1>📊 EOD BALANCING</h1>

    <div class="eod-balancing">
      <div class="main-calculation">
        <div class="section-header">
          <span class="icon">🧮</span> Main Calculation
        </div>

        <div class="sub-header"><span class="icon">💰</span> Cash Capital</div>
        <input
          type="number"
          placeholder="Enter Cash Capital"
          id="cash-capital"
        />

        <div class="sub-header">
          <span class="icon">💻</span> Cyber Cafe / POS
        </div>
        <input type="number" placeholder="Enter Cash Left" id="cash-left" />

        <div class="sub-header"><span class="icon">📈</span> Sales</div>
        <input type="number" placeholder="Sales Cash" id="sales-cash" />
        <input type="number" placeholder="Sales POS Amount" id="sales-pos" />

        <div class="sub-header">
          <span class="icon">💳</span> Calculating Amount in POS
        </div>
        <input
          type="number"
          placeholder="Current Amount in POS"
          id="current-pos-amount"
        />
        <input
          type="number"
          placeholder="Enter amount left in POS yesterday"
          id="pos-capital"
        />

        <button class="btn btn-primary" id="calculate-btn">Calculate</button>

        <div id="profit-or-loss"></div>
        <div id="calculation-report"></div>
      </div>

      <!-- RIGHT: Expenses -->
      <div class="expense">
        <div class="section-header">
          <span class="icon">📝</span> Expenses Entry
        </div>

        <input type="text" placeholder="Enter an expense" id="expense" />
        <input type="number" placeholder="Enter Amount" id="expense-amount" />

        <button class="btn btn-success" id="add-expense-btn">
          ➕ Add an Expense
        </button>

        <div id="expenses-list">
          <div class="empty-message">No expenses added yet.</div>
        </div>
      </div>
    </div>
  </body>
  <script src="script.js"></script>
</html>
